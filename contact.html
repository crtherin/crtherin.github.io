<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Safari Tabs</title>
  <meta name="description" content="Get help with the Safari Tabs add-on or the Sync for Safari Tabs app.">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <img src="icon.svg" alt="">
    <h1>Contact</h1>
  </header>
  <p class="lede">Questions or problems with the Safari Tabs add-on or the Sync for Safari Tabs app.</p>

  <form id="contact" action="https://api.web3forms.com/submit" method="post">
    <input type="hidden" name="access_key" value="WEB3FORMS_ACCESS_KEY">
    <input type="hidden" name="subject" value="Safari Tabs contact form">
    <input type="hidden" name="from_name" value="Safari Tabs website">
    <!-- Left empty by people, filled in by spam bots. -->
    <input class="trap" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">

    <label for="name">Name <span>(optional)</span></label>
    <input id="name" name="name" type="text" autocomplete="name">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="7" required></textarea>

    <button type="submit">Send</button>
    <p id="status" class="status" role="status"></p>
  </form>

  <p class="updated">Your message is delivered by Web3Forms and used only to reply to you. See the <a href="privacy.html">privacy policy</a>.</p>

  <nav><a href="./">Safari Tabs</a><a href="privacy.html">Privacy policy</a><a href="terms.html">Terms of use</a></nav>
</main>
<script>
  const form = document.getElementById("contact");
  const status = document.getElementById("status");
  const button = form.querySelector("button");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    button.disabled = true;
    status.textContent = "Sending…";
    try {
      const response = await fetch(form.action, {
        method: "POST",
        headers: { Accept: "application/json" },
        body: new FormData(form),
      });
      const result = await response.json();
      if (!response.ok || !result.success) throw new Error(result.message);
      form.reset();
      status.textContent = "Thanks, your message was sent.";
    } catch {
      status.textContent = "Your message couldn’t be sent. Please try again in a little while.";
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
